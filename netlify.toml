[build]
  # Base directory where package.json lives
  base = "frontend"
  
  # Build command (runs inside frontend/)
  command = "npm run build"

[build.environment]
  # Node.js version - Next.js 15 prefers Node 20
  NODE_VERSION = "20"

# Use the official Next.js plugin for SSR support
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
